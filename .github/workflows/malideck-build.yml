name: MaliDeck Build and Release
run-name: Build and Release MaliDeck ${{ github.sha }}

on:
  push:
    branches: [ main, mali ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build MaliDeck APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Prepare preloads and runtime inputs
        run: |
          mkdir -p app/build/packs
          # Create empty placeholder archives for add-on packs if not built in CI
          for p in proot directaudio tracking xbox comet; do
            touch "app/build/packs/${p}.tar.zst"
          done
          mkdir -p app/build/prepared-assets

      - name: Build Release APK
        env:
          DROIDDECK_BUILD_LABEL: "MaliDeck v0.6.0-mali-1.0.0"
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: malideck-unsigned-apk
          path: app/build/outputs/apk/release/*.apk

  sign-and-release:
    name: Sign and Publish Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: malideck-unsigned-apk
          path: in

      - name: Sign APK with Keystore
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          export BUILD_TOOLS
          KEYSTORE="$RUNNER_TEMP/release.p12"
          echo "$RELEASE_KEYSTORE_B64" | base64 -d > "$KEYSTORE"
          
          mkdir -p out
          in_apk=(in/*.apk)
          out_apk="out/MaliDeck-v0.6.0-mali-1.0.0.apk"
          
          "$BUILD_TOOLS/zipalign" -p -f 4 "${in_apk[0]}" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" --ks-type PKCS12 --ks-pass "pass:$RELEASE_STORE_PASSWORD" \
            --ks-key-alias droiddeck --key-pass "pass:$RELEASE_STORE_PASSWORD" \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out "$out_apk" "$RUNNER_TEMP/aligned.apk"
          
          ( cd out && sha256sum MaliDeck-v0.6.0-mali-1.0.0.apk > SHA256SUMS.txt )
          cat out/SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v0.6.0-mali-1.0.0"
          TITLE="MaliDeck v0.6.0-mali-1.0.0 (ARM Mali Optimized)"
          cat << 'BODY' > release_notes.md
          # MaliDeck v0.6.0-mali-1.0.0

          Based on DroidDeck (GPL-3.0) — optimized for ARM Mali GPUs.

          ### Highlights
          - **Rebrand:** Application ID `com.malideck.launcher`, MaliDeck branding with proper GPL-3.0 attribution.
          - **Mali & PanVK:** Automatic `/dev/mali0` detection, safe runtime driver import, bypass gamescope WSI when needed.
          - **30 FPS Adaptive Performance Engine:**
            - Dynamic governor scaling resolution & FSR when FPS drops below 30.
            - Honest advisory when 30 FPS cannot be reached on hardware.
            - Thermal throttling detection and lower profile guidance.
            - Frame Generation protection (blocks unsafe multipliers, crash auto-disable).
            - Persistent shader caches for Mesa, DXVK, and VKD3D.
          - **External Games:** Pick Windows `.exe`, `.bat`, `.msi`, Linux `.AppImage`, `.sh` directly from storage.
          - **One-Tap Diagnostics:** Detailed GPU, kbase, SoC, and session report for GitHub issues.
          - **Clean Build:** Adreno Turnip assets excluded, signed with release key, shrink enabled.
          BODY
          
          gh release create "$TAG" out/MaliDeck-v0.6.0-mali-1.0.0.apk out/SHA256SUMS.txt \
            --title "$TITLE" --notes-file release_notes.md --target "${{ github.sha }}"
